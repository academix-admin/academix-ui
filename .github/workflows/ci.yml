name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: build-test (React ${{ matrix.react }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 18.3.1 is what the packages pin and what academix-web and store-manager run.
        # 19.3.0 is what JIMSteps runs. Both must stay green.
        react: ['18.3.1', '19.3.0']
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      # Rewrites the react/react-dom devDependency pins in this checkout only, then reinstalls.
      - name: Use React ${{ matrix.react }}
        if: matrix.react != '18.3.1'
        run: node scripts/use-react.mjs ${{ matrix.react }} && npm install --no-audit --no-fund

      - name: React in use
        run: node -p "'react ' + require('react/package.json').version + ', react-dom ' + require('react-dom/package.json').version"

      # Dependency order (scripts/build.mjs), so cross-package type resolution works on a
      # clean checkout (e.g. bottom-viewer -> overlay-route).
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      # Every export locked by a test and named in its README (scripts/check-surface.mjs).
      - name: Public surface
        run: npm run check:surface

      # Each package's gzipped entry within size-budgets.json.
      - name: Size
        run: npm run size

  # The example apps on phone-shaped engines: WebKit as an iPhone, Chromium as an Android phone.
  e2e:
    name: e2e (WebKit iPhone, Chromium Android, desktop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit chromium
      - run: npm run e2e
