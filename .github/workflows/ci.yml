name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      # Build first so cross-package type resolution (e.g. search-viewer ->
      # modal-sheet) and package-name imports in tests work.
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      # domain-types: the committed generated TS must match contracts/contracts.schema.json.
      # (Dart output targets the separate academix-app repo, so it's skipped here and drift-checked
      # in that repo's own workflow.)
      - name: Domain-types codegen in sync
        run: npm run verify --workspace @academix-admin/domain-types
